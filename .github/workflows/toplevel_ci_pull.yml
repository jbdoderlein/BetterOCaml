# This is a basic workflow to help you get started with Actions

name: CI Pull

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  pull_request:
    paths:
      - 'toplevel_build/**'
      - '!toplevel_build/BUILD.md'
      - '!toplevel_build/compile.sh'
      - 'merlin_build/**'
      - '!merlin_build/README.md'
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Install opam
        run : |
          sudo apt update
          sudo apt install opam libx11-dev libxft-dev
          opam init
      
      - name: Compile
        run: |
          cd toplevel_build
          chmod +x compile.sh
          bash compile.sh -k --effects double-translation 5.5.1
          bash compile.sh -k --suffix -noeffects 5.5.1
          cd ..
          cp toplevel_build/builds/toplevel-5.5.1.js src/toplevels/toplevel-5.5.1.js
          cp toplevel_build/builds/toplevel-5.5.1-noeffects.js src/toplevels/toplevel-5.5.1-noeffects.js

      # Merlin for the editor, built in the switch of the toplevel so that the .cmi files match
      - name: Build merlin worker
        run: |
          eval $(opam env --switch=5.5.1)
          opam install --yes merlin-lib
          bash merlin_build/build.sh
          test -f src/merlin/merlin_worker.js -a -f src/merlin/cmis/stdlib.cmi
      
      - name: Check if file exist
        run: test -f "./toplevel_build/builds/toplevel-5.5.1.js" -a -f "./toplevel_build/builds/toplevel-5.5.1-noeffects.js" || exit 1
        
      
      
      
      
